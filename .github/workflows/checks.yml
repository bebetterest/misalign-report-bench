name: Offline checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run mrbench validate
      - name: Check the Harbor snapshot
        run: |
          snapshot_dir=$(mktemp -d)
          uv run mrbench export-harbor --output "$snapshot_dir/harbor-tasks"
          diff -ru harbor-tasks "$snapshot_dir/harbor-tasks"
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python tools/check_environments.py
      - run: uv run python tools/check_robustness.py
      - run: uv build --wheel
