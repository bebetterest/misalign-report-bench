services:
  main:
    depends_on:
      simulation:
        condition: service_healthy
  simulation:
    build: ./simulation
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 1s
      timeout: 3s
      retries: 30
